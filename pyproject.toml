[project]
name = "simple-word-wrap"
version = "0.1.0"
description = "Wrap text to a given column width while keeping each line's existing leading whitespace on every continuation line it produces."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
